services:
  backend:
    build: ./backend
    environment:
      PORT: "8080"
      # Saved analyses (a match is only recalculated on request); kept across restarts in the volume.
      DATA_DIR: /data
    volumes:
      - analyses:/data
    # Chromium needs a larger /dev/shm than Docker's 64MB default.
    shm_size: "1gb"
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      # Host port is configurable (8080/8088 are often taken). Default: 9090.
      - "${APP_PORT:-9090}:80"
    restart: unless-stopped

volumes:
  analyses:
